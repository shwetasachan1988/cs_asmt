services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shortener
      DB_USER: shortener
      DB_PASSWORD: shortener
      REDIS_HOST: redis
      BASE_URL: http://localhost:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # optional: enables the Claude advisory review
    ports: ["8080:8080"]
    volumes: [workspace:/app/workspace]

  # `docker compose --profile demo run --rm demo --auto` : drives the three scenarios; evidence lands in ./docs/runs
  demo:
    profiles: ["demo"]
    build: .
    depends_on:
      app: { condition: service_healthy }
    user: "0"
    entrypoint: ["java", "-Dloader.main=com.sa.agentic.demo.DemoRunner", "-cp", "app.jar",
                 "org.springframework.boot.loader.launch.PropertiesLauncher", "--base", "http://app:8080", "--out", "/out"]
    volumes: ["./docs/runs:/out"]

  # `docker compose --profile test run --rm tests` : full unit + integration suite, no local JDK needed
  tests:
    profiles: ["test"]
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - .:/app
      - m2cache:/root/.m2
    command: mvn -B test

volumes:
  pgdata:
  workspace:
  m2cache:
